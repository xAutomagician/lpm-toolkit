repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: docker compose run --rm -T api ruff check --fix .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format
        entry: docker compose run --rm -T api ruff format .
        language: system
        pass_filenames: false
        always_run: true
